<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crystal campaign slideshow</title><style>body{margin:0;background:#202323;color:#fff;font:16px Arial;text-align:center}main{height:88vh;display:grid;place-items:center}img{max-height:86vh;max-width:96vw;object-fit:contain}button{font:inherit;padding:10px 16px;margin:5px;cursor:pointer;background:#f5f0e7;border:0;border-radius:3px}footer{padding:5px}small{display:block;color:#bbb}</style><main><img id="slide" src="01-magnetic-chucks.png" alt="Crystal magnetic chuck campaign advertisement"></main><footer><button id="previous">Previous</button><button id="play">Play slideshow</button><button id="next">Next</button><button id="full">Full screen</button><small>Three campaign stills · five seconds per slide · no audio</small><span id="status" role="status">1 / 3</span></footer><script>const slides=[['01-magnetic-chucks.png','Crystal magnetic chuck campaign advertisement'],['02-v-blocks.png','Crystal V block campaign advertisement'],['03-magnetic-lifters.png','Crystal magnetic lifter campaign advertisement']];let n=0,timer=null;const im=document.querySelector('#slide'),b=document.querySelector('#play');function show(i){n=(i+slides.length)%slides.length;im.src=slides[n][0];im.alt=slides[n][1];document.querySelector('#status').textContent=(n+1)+' / 3'}document.querySelector('#next').onclick=()=>show(n+1);document.querySelector('#previous').onclick=()=>show(n-1);b.onclick=()=>{if(timer){clearInterval(timer);timer=null;b.textContent='Play slideshow'}else{timer=setInterval(()=>show(n+1),5000);b.textContent='Pause'}};document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(n+1);if(e.key==='ArrowLeft')show(n-1)});</script></html>
